services:
  db_test:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: commissions
      POSTGRES_PASSWORD: commissions
      POSTGRES_DB: commissions_test
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commissions"]
      interval: 5s
      timeout: 3s
      retries: 5